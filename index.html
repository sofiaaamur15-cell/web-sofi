<!DOCTYPE html>
<html>
  
  <head>
    <meta charset="UTF-8">
    <title>Sofia Mur | Fashion Designer</title>

    <style>
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        min-height: 100vh;
        overflow: hidden;
        display: flex;
      }

      .menu{
        position: relative;
        height: 100vh;
        width: 20vw;
        min-width: 100px;
        margin: 0 2vw;
        padding: 10vh 2vw;
        box-shadow: 2px 0 30px rgba(0,0,0,0.2);

      }

      h3{
        font-family: "Helvetica", sans-serif;
      }

      h4{
        font-family: "Helvetica", sans-serif;
      }

      .slider{
        margin-top: 10vh;
        height: 80vh;
        display: flex;
        gap: 20px;
        overflow-x: auto;
        overflow-y: hidden;
        box-shadow: 2px 0 30px rgba(0,0,0,0.3);
      }

      .slider:active {
        cursor: grabbing; /* Cambia el cursor cuando se está arrastrando */
      }

      /* Ocultar barra de scroll */
      .slider::-webkit-scrollbar {
        display: none;
      }

      .slide{
        height: 80vh;
        width: auto;
        flex-shrink: 0;
        box-shadow: 2px 0 30px rgba(0,0,0,0.6);
      }

      .slide img {
        height: 100%;
        max-width: 100%;
        width: auto;
      }
    </style>
  </head>
  <body>
    <div class="menu">
        <h3>Sofia Mur</h3>
        <h4>About me</h4>
    </div>
    

    <div class="slider">
        <div class="slide">
            <img src="img/coleccion/foto portada 1r cuadradito.jpeg" alt="">
        </div>
        <div class="slide">
            <img src="img/foto 2.jpg" alt="">
        </div>
        <div class="slide">
            <img src="img/foto 3.jpg" alt="">
        </div>
        <div class="slide">
            <img src="img/foto4.jpg" alt="">
        </div>
        <div class="slide">
            <img src="img/foto 5.jpg" alt="">
        </div>
    </div>
    
  </body>
</html>
