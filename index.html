<!DOCTYPE html>
<html>
  
  <head>
    <meta charset="UTF-8">
    <title>Sofia Mur | Fashion Designer</title>

    <style>
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        min-height: 100vh;
        overflow-x: hidden;
        overflow-y: auto;
      }

      h3{
        position: fixed;
        top: 20px;
        left: 20px;
        margin: 0;
        z-index: 10;
        font-family: "Helvetica", sans-serif;
      }

      .imagen-principal {
        width: 100%;
        height: 100vh;
        margin-top: 50px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      img {
        max-width: 100%;
        max-height: 100%;
      }

      h5{
        margin: 0;
      }

      .contenedor-cuadradadito {
        display: flex;
        flex-wrap: wrap;
        gap: 20px;
        justify-content: center;
        align-items: flex-start;
        min-height: 100vh;
        padding: 20px;
      }

      .cuadradito{
        width: 400px;
        height: 400px;
        border: 1px solid black;
        border-radius: 0;
        padding: 10px;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <h3>Sofia Mur</h3>
    <div class="imagen-principal">
        <img src="img/portada 2.jpg" alt=""/>
    </div>

    <div class="contenedor-cuadradito">
        <div class="cuadradito" style="margin-left: 50vw;">
            <h5>cuadradito 1</h5>
            <img src="img/coleccion/foto portada 1r cuadradito.jpeg" alt="">
        </div>
        <div class="cuadradito" style="margin-left: 30px;">
            <h5>cuadradito 2</h5>
        </div>
        <div class="cuadradito" style="margin-left: 40vw;">
            <h5>cuadradito 3</h5>
        </div>
        <div class="cuadradito" style="margin-left: 10vw;">
            <h5>cuadradito 4</h5>
        </div>
    </div>
    
  </body>
</html>
