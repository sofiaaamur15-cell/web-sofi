<!DOCTYPE html>
<html>
  
  <head>
    <meta charset="UTF-8">
    <title>Sofia Mur | Fashion Designer</title>

    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        min-height: 100vh;
      }

      body{
        overflow: hidden;
        display: flex;
      }

      .menu{
        position: relative;
        height: 100vh;
        width: 20vw;
        min-width: 100px;
        margin: 0 2vw;
        padding: 10vh 2vw;
        box-shadow: 2px 0 30px rgba(0,0,0,0.2);

      }

      a{
        font-family: "Helvetica", sans-serif;
      }

      .slider{
        margin-top: 10vh;
        height: 80vh;
        display: flex;
        gap: 20px;
        overflow-x: auto;
        overflow-y: hidden;
        box-shadow: 2px 0 30px rgba(0,0,0,0.3);
      }

      .slider:active {
        cursor: grabbing; /* Cambia el cursor cuando se está arrastrando */
      }

      /* Ocultar barra de scroll */
      .slider::-webkit-scrollbar {
        display: none;
      }

      .slider a {
        display: block;
        height: 80vh;
        width: auto;
        flex-shrink: 0;
        box-shadow: 2px 0 30px rgba(0,0,0,0.6);
      }

      .slider a img {
        height: 100%;
        max-width: 100%;
        width: auto;
        display: block;
      }

      /* Tablet y móvil */
      @media (max-width: 768px) {
        body {
          flex-direction: column;
          overflow-y: auto;
        }
        
        .menu {
          /*position: fixed;*/
          width: 100%;
          height: auto;
          margin: 0;
          padding: 20px;
          display: flex;
          justify-content: space-between;
        }

        .menu a:last-child {
          margin-right: 40px;
        }
        
        .slider {
          flex-direction: column;
          height: auto;
          gap: 30px;
          margin-top: 0;
          padding: 50px;
          overflow-x: hidden;
          box-shadow: none;
        }
        
        .slider a {
          width: 100%;
          height: auto;
          max-width: 600px;
          margin: 0 auto;
        }
        
        .slider a img {
          width: 100%;
          height: auto;
        }
      }

      /* Móvil pequeño */
      @media (max-width: 480px) {
        .menu {
          flex-direction: column;
          gap: 10px;
          text-align: center;
        }

        .menu a:last-child {
          margin-right: 0;
        }
        
        .slider {
          padding: 10px;
          gap: 20px;
        }
      }

      
    </style>
  </head>
  <body>
    <div class="menu">
        <a href="index.html">Sofia Mur</a>
        <a href="about.html">About me</a>
    </div>
    

    <div class="slider">
      <a href="proyectos/proyecto1.html">
         <img src="img/coleccion/foto portada 1r cuadradito.jpeg" alt="">
      </a>

      <a href="proyectos/proyecto2.html">
            <img src="img/foto 2.jpg" alt="">
      </a>

      <a href="proyectos/proyecto3.html">
            <img src="img/foto 3.jpg" alt="">
      </a>

      <a href="proyectos/proyecto4.html">
            <img src="img/foto4.jpg" alt="">
      </a>

      <a href="proyectos/proyecto5.html">
            <img src="img/foto 5.jpg" alt="">
      </a>
    </div>
    
  </body>
</html>
