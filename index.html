<!DOCTYPE html>
<html>
  
  <head>
    <meta charset="UTF-8">
    <title>Sofia Mur | Fashion Designer</title>

    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        min-height: 100vh;
      }

      body{
        overflow: hidden;
        display: flex;
      }

      .menu{
        position: relative;
        height: 100vh;
        width: 20vw;
        min-width: 100px;
        margin: 0 2vw;
        padding: 6vh 2vw;
        box-shadow: 2px 0 30px rgba(0,0,0,0.2);

      }

      .menu a{
        font-size: 15px;
        color: black;
        text-decoration: none;
        font-family: "Helvetica", sans-serif;
        display: block;
        margin-bottom: 10px;
      }

      .menu a:first-child{
        font-size: 20px;
        font-weight: bold;
        margin-bottom: 30px;
      }

      .slider{
        margin-top: 10vh;
        height: 80vh;
        display: flex;
        gap: 20px;
        overflow-x: auto;
        overflow-y: hidden;
        box-shadow: 2px 0 30px rgba(0,0,0,0.3);
      }

      .slider:active {
        cursor: grabbing; /* Cambia el cursor cuando se está arrastrando */
      }

      /* Ocultar barra de scroll */
      .slider::-webkit-scrollbar {
        display: none;
      }

      .slider a {
        display: block;
        height: 80vh;
        width: auto;
        flex-shrink: 0;
        box-shadow: 2px 0 30px rgba(0,0,0,0.6);
      }

      .slider a img {
        height: 100%;
        max-width: 100%;
        width: auto;
        display: block;
      }

      /* Tablet y móvil */
      @media (max-width: 768px) {
        body {
          flex-direction: column;
          overflow-y: auto;
        }
        
        .menu {
          position: fixed;
          width: 100%;
          height: 60px;
          margin: 0;
          padding: 0 55px;
          display: flex;
          align-items: center;
          justify-content: start;
          background-color: white;
          z-index: 10;
        }

        .menu a {
          height: 30px;
          align-content: center;
          padding: 0 5px;
          font-size: 17px;
          margin-right: 35px;
          margin-bottom: 0 !important;
        }
        
        .slider {
          flex-direction: column;
          height: auto;
          gap: 30px;
          margin-top: 60px;
          padding: 30px 50px;
          overflow-x: hidden;
          box-shadow: none;
        }
        
        .slider a {
          width: 100%;
          height: auto;
          max-width: 600px;
          margin: 0 auto;
        }
        
        .slider a img {
          width: 100%;
          height: auto;
        }
      }

      /* Móvil pequeño */
      @media (max-width: 480px) {
        .menu {
          padding: 0 20px;
        }

        .menu a{
          font-size: 15px !important;
          margin-right: 10px;
        }
        
        .slider {
          padding: 20px;
          gap: 20px;
        }
      }

      
    </style>
  </head>
  <body>
    <div class="menu">
        <a href="index.html">Sofia Mur</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
    </div>
    

    <div class="slider">
      <a href="proyectos/proyect1.html">
         <img src="img/coleccion/foto portada 1r cuadradito.jpeg" alt="">
      </a>

      <a href="proyectos/proyect2.html">
            <img src="img/foto 2.jpg" alt="">
      </a>

      <a href="proyectos/proyect3.html">
            <img src="img/foto 3.jpg" alt="">
      </a>

      <a href="proyectos/proyect4.html">
            <img src="img/foto4.jpg" alt="">
      </a>

      <a href="proyectos/proyect5.html">
            <img src="img/foto 5.jpg" alt="">
      </a>
    </div>
    
  </body>
</html>
